<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Atiqah is online</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="portfolio-page">


    <!-- =====================================
         FOLDER
    ====================================== -->

    <section class="folder-section">

      <button
        class="folder-button"
        type="button"
        aria-label="Everything portfolio here"
      >

        <div class="folder-icon">

          <div class="folder-back"></div>

          <div class="folder-front"></div>

        </div>


        <span class="folder-name">
          everything portfolio here
        </span>

      </button>

    </section>



    <!-- =====================================
         MAIN PORTFOLIO AREA
    ====================================== -->

    <section class="portfolio-core">


      <!-- HEADER -->

      <div class="portfolio-header">

        <h1 class="portfolio-heading">

          <em>Atiqah</em>
          is
          <strong>online</strong>,
          a portfolio

        </h1>

      </div>



      <!-- ORNAMENT -->

      <div
        class="ornament"
        id="ornament"
        aria-hidden="true"
      >

        <div id="ornamentMount"></div>

      </div>



      <!-- =====================================
           TRANSLATOR
      ====================================== -->

      <iframe
        class="translator-widget"
        src="./gtr/"
        title="About Atiqah translator"
      ></iframe>



      <!-- =====================================
           NAVIGATION
      ====================================== -->

      <iframe
        class="navigation-widget"
        src="./nav/"
        title="Portfolio navigation"
      ></iframe>


    </section>


  </main>


  <script src="script.js"></script>

</body>

</html>
