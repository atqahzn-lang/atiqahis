<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Atiqah is online</title>

  <link
    rel="stylesheet"
 href="style.css?v=2"  
    >
</head>


<body>

  <main class="portfolio-page">


    <!-- ======================================
         FOLDER + WIP FILES
    ======================================= -->

    <section class="folder-wip-zone">

      <button
        class="folder-button"
        id="folderButton"
        type="button"
        aria-expanded="false"
        aria-controls="wipFiles"
      >

        <div class="folder-icon">

          <div class="folder-back"></div>

          <div class="folder-front"></div>

        </div>


        <span class="folder-name">
          everything portfolio here
        </span>

      </button>



      <div
        class="wip-files"
        id="wipFiles"
        aria-hidden="true"
      >


        <!-- WIP 1 -->

        <a
          class="wip-file"
          href="#"
          style="--file-index: 0;"
        >

          <span class="wip-tag">
            WIP
          </span>

          <div class="wip-sheet">

            <img
              src="./wip/wip-file.svg"
              alt=""
              class="wip-sheet-vector"
            >

            <span class="wip-title">
              Portfolio build
            </span>

          </div>

        </a>



        <!-- WIP 2 -->

        <a
          class="wip-file"
          href="#"
          style="--file-index: 1;"
        >

          <span class="wip-tag">
            WIP
          </span>

          <div class="wip-sheet">

            <img
              src="./wip/wip-file.svg"
              alt=""
              class="wip-sheet-vector"
            >

            <span class="wip-title">
              Learning log
            </span>

          </div>

        </a>



        <!-- WIP 3 -->

        <a
          class="wip-file"
          href="#"
          style="--file-index: 2;"
        >

          <span class="wip-tag">
            WIP
          </span>

          <div class="wip-sheet">

            <img
              src="./wip/wip-file.svg"
              alt=""
              class="wip-sheet-vector"
            >

            <span class="wip-title">
              New case study
            </span>

          </div>

        </a>



        <!-- WIP 4 -->

        <a
          class="wip-file"
          href="#"
          style="--file-index: 3;"
        >

          <span class="wip-tag">
            WIP
          </span>

          <div class="wip-sheet">

            <img
              src="./wip/wip-file.svg"
              alt=""
              class="wip-sheet-vector"
            >

            <span class="wip-title">
              Creative experiment
            </span>

          </div>

        </a>


      </div>

    </section>



    <!-- ======================================
         INTRO + ORNAMENT
    ======================================= -->

    <section class="intro-section">

      <div class="intro-header">

        <h1 class="portfolio-heading">
          <em>Atiqah</em> is <strong>online</strong>, a portfolio
        </h1>


        <div
          class="ornament"
          id="ornament"
          aria-hidden="true"
        >
          <div id="ornamentMount"></div>
        </div>

      </div>



      <!-- ======================================
           TRANSLATOR
      ======================================= -->

      <iframe
        class="translator-widget"
        src="./gtr/"
        title="About Atiqah translator"
      ></iframe>

    </section>



    <!-- ======================================
         NAVIGATION
    ======================================= -->

    <section class="navigation-section">

      <iframe
        class="navigation-widget"
        src="./nav/"
        title="Portfolio navigation"
      ></iframe>

    </section>



    <!-- ======================================
         FUTURE CONTENT
    ======================================= -->

    <section
      class="work-section"
      id="work"
    >
    </section>


  </main>


<script src="script.js?v=2"></script>
  
</body>

</html>
