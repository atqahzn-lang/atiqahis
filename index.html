<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Atiqah is online</title>

  <!-- PAGE -->
  <link rel="stylesheet" href="style.css">

  <!-- COMPONENTS -->
  <link rel="stylesheet" href="header/header.css">
  <link rel="stylesheet" href="translator/translator.css">
  <link rel="stylesheet" href="navbar/navbar.css">
</head>


<body>

  <main class="portfolio-page">

    <div class="portfolio-shell">


      <!-- =====================================
           HEADER
      ====================================== -->

      <header class="profile-header">

        <div
          class="profile-dot"
          aria-hidden="true"
        ></div>


        <div class="profile-copy">

          <div class="profile-title">
            <em>Atiqah</em> is <strong>online</strong>,
            <br>
            a portfolio
          </div>

          <div class="profile-url">
            atiqahis.online
          </div>

        </div>

      </header>



      <!-- =====================================
           ORNAMENT
      ====================================== -->

      <div
        class="ornament"
        id="ornament"
        aria-hidden="true"
      >
        <div id="ornamentMount"></div>
      </div>



      <!-- =====================================
           TRANSLATOR
      ====================================== -->

      <section
        class="translator"
        aria-label="About Atiqah"
      >

        <div class="translator-widget">


          <!-- CONTROLS -->

          <div class="controls">

            <div class="control-group">

              <div class="control-label">
                Questions
              </div>


              <div
                class="dropdown"
                id="portfolioDropdown"
              >

                <button
                  class="dropdown-trigger"
                  id="dropdownTrigger"
                  type="button"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="questionMenu"
                >

                  <span
                    class="dropdown-trigger-text"
                    id="dropdownTriggerText"
                  >
                    <span class="prompt-italic">
                      What are you
                    </span>

                    <span class="prompt-bold">
                      curious
                    </span>

                    <span class="prompt-italic">
                      about?
                    </span>
                  </span>

                  <span
                    class="dropdown-flower"
                    aria-hidden="true"
                  >
                    ✿
                  </span>

                </button>


                <ul
                  class="dropdown-menu"
                  id="questionMenu"
                  role="listbox"
                >

                  <li>
                    <button
                      class="dropdown-option"
                      type="button"
                      role="option"
                      data-value="who"
                      tabindex="-1"
                    >
                      Who is Atiqah?
                    </button>
                  </li>

                  <li>
                    <button
                      class="dropdown-option"
                      type="button"
                      role="option"
                      data-value="this"
                      tabindex="-1"
                    >
                      What is this, even?
                    </button>
                  </li>

                  <li>
                    <button
                      class="dropdown-option"
                      type="button"
                      role="option"
                      data-value="worked"
                      tabindex="-1"
                    >
                      What I’ve worked on.
                    </button>
                  </li>

                  <li>
                    <button
                      class="dropdown-option"
                      type="button"
                      role="option"
                      data-value="working"
                      tabindex="-1"
                    >
                      What I’m working on.
                    </button>
                  </li>

                  <li>
                    <button
                      class="dropdown-option"
                      type="button"
                      role="option"
                      data-value="misc"
                      tabindex="-1"
                    >
                      Miscellaneous...miscle..misc
                    </button>
                  </li>

                </ul>

              </div>

            </div>



            <div class="control-group">

              <div
                class="control-label"
                aria-hidden="true"
              >
                &nbsp;
              </div>

              <div
                class="switch-column"
                aria-hidden="true"
              >
                <span class="native-switch">
                  ⇄
                </span>
              </div>

            </div>



            <div class="control-group">

              <div class="control-label">
                My Answers
              </div>

              <div class="answer-field">
                Let’s talk about it
              </div>

            </div>

          </div>



          <!-- CONTENT -->

          <div class="content">

            <div class="context-area">

              <p
                class="context-text"
                id="contextText"
              >
                Pick something from the dropdown
              </p>

            </div>


            <div
              class="content-spacer"
              aria-hidden="true"
            ></div>


            <div class="answer-area">

              <div class="answer-card">

                <p
                  class="answer-text"
                  id="answerText"
                  aria-live="polite"
                ></p>

              </div>

            </div>

          </div>



          <!-- FOOTER LINE -->

          <div class="translator-footer">

            <span class="footer-atiqah">
              Atiqah is online
            </span>

          </div>

        </div>

      </section>



      <!-- =====================================
           NAVBAR
      ====================================== -->

      <section class="nav-section">

        <div
          class="nav-stage"
          id="stage"
        >

          <canvas
            id="particleCanvas"
            width="1440"
            height="880"
            aria-hidden="true"
          ></canvas>


          <nav
            class="nav"
            id="nav"
            aria-label="Portfolio navigation"
          ></nav>


          <p
            class="status"
            id="status"
            role="status"
          ></p>

        </div>

      </section>


    </div>

  </main>


  <script src="header/header.js"></script>
  <script src="translator/translator.js"></script>
  <script src="navbar/navbar.js"></script>
  <script src="script.js"></script>

</body>

</html>
