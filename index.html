<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div
    class="widget"
    id="widget"
  >

    <div
      class="stage"
      id="stage"
    >

      <canvas
        id="particleCanvas"
        width="1440"
        height="880"
        aria-hidden="true">
      </canvas>

      <nav
        class="nav"
        id="nav"
        aria-label="Portfolio navigation">
      </nav>

      <p
        class="status"
        id="status"
        role="status">
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
