<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>About Atiqah</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <section
    class="translator-section"
    aria-label="About Atiqah"
  >

    <div
      class="glow glow-pink"
      aria-hidden="true">
    </div>

    <div
      class="glow glow-peach"
      aria-hidden="true">
    </div>

    <div
      class="glow glow-purple"
      aria-hidden="true">
    </div>


    <div class="portfolio-widget">

      <div class="controls">

        <div class="control-group">

          <div class="control-label">
            Questions
          </div>


          <div
            class="dropdown"
            id="portfolioDropdown"
          >

            <button
              class="dropdown-trigger"
              id="dropdownTrigger"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="questionMenu"
            >

              <span
                class="dropdown-trigger-text"
                id="dropdownTriggerText"
              >
                <span class="prompt-italic">
                  What are you
                </span>

                <span class="prompt-bold">
                  curious
                </span>

                <span class="prompt-italic">
                  about?
                </span>
              </span>


              <span
                class="dropdown-flower"
                aria-hidden="true"
              >
                ✿
              </span>

            </button>


            <ul
              class="dropdown-menu"
              id="questionMenu"
              role="listbox"
              aria-label="Questions about Atiqah"
            >

              <li>
                <button
                  class="dropdown-option"
                  type="button"
                  role="option"
                  aria-selected="false"
                  data-value="who"
                  tabindex="-1"
                >
                  Who is Atiqah?
                </button>
              </li>


              <li>
                <button
                  class="dropdown-option"
                  type="button"
                  role="option"
                  aria-selected="false"
                  data-value="this"
                  tabindex="-1"
                >
                  What is this, even?
                </button>
              </li>


              <li>
                <button
                  class="dropdown-option"
                  type="button"
                  role="option"
                  aria-selected="false"
                  data-value="worked"
                  tabindex="-1"
                >
                  What I’ve worked on.
                </button>
              </li>


              <li>
                <button
                  class="dropdown-option"
                  type="button"
                  role="option"
                  aria-selected="false"
                  data-value="working"
                  tabindex="-1"
                >
                  What I’m working on.
                </button>
              </li>


              <li>
                <button
                  class="dropdown-option"
                  type="button"
                  role="option"
                  aria-selected="false"
                  data-value="misc"
                  tabindex="-1"
                >
                  Miscellaneous...miscle..misc
                </button>
              </li>

            </ul>

          </div>

        </div>


        <div class="control-group">

          <div
            class="control-label"
            aria-hidden="true"
          >
            &nbsp;
          </div>

          <div
            class="switch-column"
            aria-hidden="true"
          >
            <span class="native-switch">
              ⇄
            </span>
          </div>

        </div>


        <div class="control-group">

          <div class="control-label">
            My Answers
          </div>

          <div class="answer-field">
            Let’s talk about it
          </div>

        </div>

      </div>


      <div class="content">

        <div class="context-area">

          <p
            class="context-text"
            id="contextText"
          >
            Pick something from the dropdown
          </p>

        </div>


        <div
          class="content-spacer"
          aria-hidden="true"
        >
        </div>


        <div class="answer-area">

          <div class="answer-card">

            <p
              class="answer-text"
              id="answerText"
              aria-live="polite"
            >
            </p>

          </div>

        </div>

      </div>


      <div class="footer">

        <span class="footer-atiqah">
          Atiqah
        </span>

        &nbsp;

        <span class="footer-online">
          is online
        </span>

      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>

</html>
